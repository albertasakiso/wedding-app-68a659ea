<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0;url=/" />
  <title>Redirecting…</title>
  <script>
    // Preserve the path so React Router can handle it
    sessionStorage.setItem('redirect', location.pathname + location.search + location.hash);
    location.replace('/');
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
